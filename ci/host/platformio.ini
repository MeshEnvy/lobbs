; Host protocol tests. From repo root: cd ci/host && pio test -e host -f test_protocol_host
[platformio]
src_dir = ../..
test_dir = test

[env:host]
platform = native
extra_scripts = ../../platforms/extra_script.py
test_framework = unity
test_build_src = true
build_flags =
  -std=c++17
  -DLOBBS_PLATFORM_NATIVE=1
  -DPIO_UNIT_TESTING=1
build_src_filter =
  +<protocol/**>
  +<loscalar/**>
  +<loutil/**>
  -<protocol/plain_text/serialize.cpp>
  +<platforms/native/**>
  +<platforms/LoPlatform.h>
  +<LoWire.h>
  +<LoBBSReply.h>
  +<LoBBSResponse.h>
  +<LoBBSArch.h>
  +<LoBBSConfig.h>
  +<LoBBSStackGuard.cpp>
  +<LoBBSStackGuard.h>
